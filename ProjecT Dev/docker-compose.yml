version: "3.8"

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: yplaza
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: root123
      DB_NAME: yplaza
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Attente MySQL...' &&
        sleep 5 &&
        echo 'Initialisation BDD...' &&
        ./RedProject --seed 2>&1 &&
        echo 'Démarrage serveur...' &&
        ./RedProject
      "
    restart: unless-stopped

volumes:
  mysql_data:
