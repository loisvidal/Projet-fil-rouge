{{define "header"}}
<header>
    <a href="/RedProject/home" class="logoHeader">
        <img src="/assets/img/Complete_logo.png" alt="">
    </a>

    <div class="searchHeader">
        <form action="" method="post">
            <input type="text" name="searchHeader" id="searchHeader" placeholder="search...">
            <button id="searchButton" type="submit"></button>
        </form>
    </div>

    <div class="connectHeader">
        {{if .Profil.IsConnect}}
            <a href="/logout" class="isConnect_register">Logout</a>
            <a href="/profile" class="isConnect_login">{{.Profil.NameUser}}</a>
        {{else}}
            <button class="isConnect_register">Register</button>
            <button class="isConnect_login">Login</button>
        {{end}}
    </div>
</header>
{{end}}
