{{define "error"}}
<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="/assets/js/theme.js"></script>
</head>
<body>

            <a href="/red_project/home" class="btn btn-primary" style="margin-top:24px;">Retour à l'accueil</a>
