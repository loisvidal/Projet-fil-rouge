{{define "connect"}}
<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/assets/css/components/connect.css">
    </head>
    <body>
        <div class="Connect">
            <div class="login">
                <h2>Login</h2>
                <form action="/red_project/login" method="post">
                    <label for="userConnect">Pseudo / Email :</label>
                    <input type="text" name="userConnect" id="loginName" class="connectName">
                    <label for="userPassword">Mot de passe : </label>
                    <input type="password" name="userPassword" id="loginPassword" class="connectPassword"
                    ><button type="submit">Login</button>
                </form>
            </div>
            <div class="register">
                <h2>Register</h2>
                <form action="/red_project/register" method="post">
                    <label for="userConnect">Pseudo / Email :</label>
                    <input type="text" name="userConnect" id="registerName" class="connectName">
                    <label for="userPassword">Mot de passe : </label>
                    <input type="password" name="userPassword" id="registerPassword" class="connectPassword">
                    <button type="submit">Register</button>
                </form>
            </div>
        </div>
        
        <script src="" async defer></script>
    </body>
</html>
{{end}}
